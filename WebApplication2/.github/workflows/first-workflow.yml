
name: ASP.NET CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    - uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'

    - run: dotnet restore
    - run: dotnet build --no-restore
    - run: dotnet test --no-build

    - run: dotnet publish -c Release -o publish
